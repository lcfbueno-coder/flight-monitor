name: Flight Monitor
on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 em Brasília
    - cron: '0 22 * * *'   # 19:00 em Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flight-monitor
  cancel-in-progress: false
jobs:
  search:
    name: Buscar preços e publicar painel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar dependências Python
        run: pip install -r requirements.txt
      - name: Instalar Chromium + dependências de sistema
        run: python -m playwright install chromium --with-deps
      - name: Buscar preços de voos
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTPUT_DIR:       docs
        shell: bash
        run: python -u search.py 2>&1 | tee log_voos.txt
      - name: Buscar preços de cruzeiros
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTPUT_DIR:       docs
        shell: bash
        run: python -u cruise_monitor.py 2>&1 | tee log_cruzeiros.txt
      - name: Salvar diagnóstico (screenshots e logs)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: debug-screenshots
          path: |
            *.png
            *.html
            log_voos.txt
            log_cruzeiros.txt
          if-no-files-found: ignore
          retention-days: 5
      - name: Commitar dados atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json docs/cruise_data.json docs/cruise_history.json
          if git diff --staged --quiet; then
            echo "Nada a commitar"
            exit 0
          fi
          git commit -m "📊 Atualiza preços $(date -u +'%d/%m/%Y %H:%M UTC')"
          git pull --rebase origin main
          git push
